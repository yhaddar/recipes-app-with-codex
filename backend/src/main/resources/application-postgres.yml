spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/recipe_manager_dev}
    username: ${DB_USERNAME:${user.name}}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
