spring:
  application:
    name: recipe-manager-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:4200/verify-email}
    reset-url: ${PASSWORD_RESET_URL:http://localhost:4200/reset-password}
  rate-limit:
    limit: ${RATE_LIMIT_MAX_REQUESTS:5}
    window: ${RATE_LIMIT_WINDOW:60s}
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:recipe-manager:rate-limit}
    trusted-proxies: ${TRUSTED_PROXIES:}
  storage:
    image-directory: ${IMAGE_STORAGE_DIRECTORY:storage/images}
    max-file-size: ${IMAGE_MAX_FILE_SIZE:5242880}

logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
