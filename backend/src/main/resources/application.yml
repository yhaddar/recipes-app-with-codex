spring:
  application:
    name: recipe-manager-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

app:
  storage:
    image-directory: ${IMAGE_STORAGE_DIRECTORY:storage/images}
    max-file-size: ${IMAGE_MAX_FILE_SIZE:5242880}

logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
